name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Sync derived version surfaces on Release Please PRs & release merges
        if: startsWith(github.head_ref, 'release-please--') || startsWith(github.event.head_commit.message, 'chore(main): release')
        run: pnpm version:sync
      - run: pnpm version:verify
      - run: pnpm -r run build
      - run: pnpm test
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
