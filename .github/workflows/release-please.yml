name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package-extension:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:sync
      - run: pnpm -r run build
      - run: pnpm test
      - name: Package Chrome Extension ZIP & Generate Checksum
        id: pkg
        run: |
          ZIP_NAME="drishti-browser-ai-extension-${{ needs.release-please.outputs.tag_name }}.zip"
          cd apps/chrome-extension/dist
          zip -r "../../../${ZIP_NAME}" .
          cd ../../..
          SHA=$(sha256sum "${ZIP_NAME}" | awk '{print $1}')
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
      - name: Upload Extension ZIP & Update Enterprise Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          ZIP_NAME="${{ steps.pkg.outputs.zip_name }}"
          SHA="${{ steps.pkg.outputs.sha256 }}"
          gh release upload "${TAG}" "${ZIP_NAME}" --clobber

          EXISTING_BODY=$(gh release view "${TAG}" --json body -q .body)
          NEW_BODY=$(cat <<EOF
          ## 👁️ Drishti Browser AI (${TAG})

          > **Production Chrome/Brave MV3 Extension + Universal MCP Gateway**  
          > Built, tested (\`19/19\` unit tests passing), and packaged automatically via GitHub Actions.

          ---

          ### 📦 Quick Extension Install
          1. Download **\`${ZIP_NAME}\`** from the **Assets** section below and unzip it.
          2. Open \`chrome://extensions/\` (or \`brave://extensions/\`) and enable **Developer mode**.
          3. Click **Load unpacked** and select the unzipped folder.

          ### 🔐 Artifact Verification
          - **SHA-256 (\`${ZIP_NAME}\`)**: \`${SHA}\`

          ---

          ${EXISTING_BODY}
          EOF
          )
          gh release edit "${TAG}" --notes "${NEW_BODY}"
